<!doctype html>
<html lang="en">
  <head>
    <!-- =====================================================
         BASIC META
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#0f172a"
    />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>Zenvix Solution — Learn. Build. Get Hired.</title>

    <meta
      name="description"
      content="Zenvix Solution helps learners build practical skills through career-focused programs, real-world projects, interview preparation, job preparation and career support."
    />

    <meta
      name="keywords"
      content="Zenvix Solution, career learning, online courses, job preparation, interview preparation, software engineering, data analytics, AI ML, cybersecurity, cloud computing, career support"
    />

    <meta
      name="author"
      content="Zenvix Solution"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- =====================================================
         CANONICAL
    ====================================================== -->

    <link
      rel="canonical"
      href="https://YOUR-DOMAIN.com/"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/images/zenvix-logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/images/zenvix-logo.png"
    />

    <!-- =====================================================
         OPEN GRAPH / FACEBOOK / LINKEDIN / WHATSAPP
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Zenvix Solution — Learn. Build. Get Hired."
    />

    <meta
      property="og:description"
      content="Build practical skills, work on real-world projects and prepare for your career with Zenvix Solution."
    />

    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />

    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/images/zenvix-og.png"
    />

    <meta
      property="og:image:alt"
      content="Zenvix Solution — Learn. Build. Get Hired."
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:site_name"
      content="Zenvix Solution"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- =====================================================
         TWITTER / X CARD
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Zenvix Solution — Learn. Build. Get Hired."
    />

    <meta
      name="twitter:description"
      content="Build practical skills, work on real-world projects and prepare for your career with Zenvix Solution."
    />

    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/images/zenvix-og.png"
    />

    <meta
      name="twitter:image:alt"
      content="Zenvix Solution — Learn. Build. Get Hired."
    />

    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-paper text-navy font-body antialiased">
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
